<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BonuApp</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Roboto', sans-serif;
        }

        body{
            background:#f4f6f9;
            color:#333;
        }

        header{
            background:#0d47a1;
            color:white;
            padding:20px;
            text-align:center;
            font-size:28px;
            font-weight:bold;
        }

        nav{
            background:#1565c0;
            display:flex;
            justify-content:center;
            gap:20px;
            padding:15px;
        }

        nav a{
            color:white;
            text-decoration:none;
            font-weight:500;
            transition:0.3s;
        }

        nav a:hover{
            color:#ffeb3b;
        }

        .container{
            width:90%;
            max-width:1200px;
            margin:40px auto;
        }

        .card{
            background:white;
            border-radius:15px;
            padding:30px;
            margin-bottom:30px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        .card h2{
            margin-bottom:20px;
            color:#0d47a1;
        }

        .login-form{
            display:flex;
            flex-direction:column;
            gap:15px;
            width:300px;
            margin:auto;
        }

        input{
            padding:12px;
            border-radius:8px;
            border:1px solid #ccc;
            font-size:16px;
        }

        button{
            padding:12px;
            border:none;
</html>
