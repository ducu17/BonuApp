<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BonuApp - Registro</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <div class="container">

    <img src="img/logoBonuApp.webp" width="150" class="logo" alt="Logo BonuApp">

    <h2>Crear Cuenta</h2>

    <form>
        <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" placeholder="Nombre completo" required>
        </div>

        <div class="form-group">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" placeholder="Correo electrónico" required>
        </div>

        <div class="form-group">
            <label for="usuario">Nombre de usuario</label>
            <input type="text" id="usuario" placeholder="Nombre de usuario" required>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Contraseña" minlength="8" required>
        </div>
        <div class="form-group">
            <label for="confirm-password">Confirmar contraseña</label>
            <input type="password" id="confirm-password" placeholder="Confirmar contraseña" minlength="8" required>
        </div>

        <p id="mensaje-error" class="error-texto"></p>

        <button type="submit">Registrarse</button>
    </form>

    <p class="form-footer">
        ¿Ya tienes cuenta? 
        <a href="login.html" class="login-link">Inicia sesión</a>
    </p>

    <script>
        const formulario = document.querySelector('form');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirm-password');
        const mensajeError = document.getElementById('mensaje-error');

        formulario.addEventListener('submit', function(event) {
            if (password.value !== confirmPassword.value) {
                event.preventDefault(); 
                mensajeError.textContent = "Las contraseñas no coinciden. Por favor, verifícalas.";
            } else {
                mensajeError.textContent = "";
            }
        });
    </script>

</div>
</body>
</html>
