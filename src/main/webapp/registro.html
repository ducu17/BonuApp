<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BonuApp - Registro</title>
    <link rel="stylesheet" href="../../../css/estilos.css">
</head>

<body>
    <div class="container">

    <img src="../../../img/logoBonuApp.webp" width="150" class="logo" alt="Logo BonuApp">

    <h2>Crear Cuenta</h2>

    <form id="formRegistro">
        <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" placeholder="Nombre completo" required>
        </div>

        <div class="form-group">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" placeholder="Correo electrónico" required>
        </div>

        <div class="form-group">
            <label for="usuario">Nombre de usuario</label>
            <input type="text" id="usuario" placeholder="Nombre de usuario" required>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Contraseña" minlength="8" required>
        </div>
        <div class="form-group">
            <label for="confirm-password">Confirmar contraseña</label>
            <input type="password" id="confirm-password" placeholder="Confirmar contraseña" minlength="8" required>
        </div>

        <p id="mensaje-error" class="error-texto"></p>

        <button type="submit">Registrarse</button>
    </form>

    <p class="form-footer">
        ¿Ya tienes cuenta? 
        <a href="login.html" class="login-link">Inicia sesión</a>
    </p>

        <script>
            // Capturar elementos del DOM
            const formulario = document.getElementById('formRegistro');
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirm-password');
            const mensajeError = document.getElementById('mensaje-error');

            // Escuchar el evento de envío del formulario
            formulario.addEventListener('submit', async function(event) {
                event.preventDefault(); // Evitar que la página se recargue

                // 1. Validar coincidencia de contraseñas localmente
                if (password.value !== confirmPassword.value) {
                    mensajeError.style.color = "red";
                    mensajeError.textContent = "Las contraseñas no coinciden. Por favor, verifícalas.";
                    return;
                }

                mensajeError.textContent = "";

                // 2. Extraer los datos de los inputs
                const nombre = document.getElementById('nombre').value;
                const correo = document.getElementById('correo').value;
                const usuario = document.getElementById('usuario').value;
                const pass = password.value;

                // 3. Empaquetar los datos para el Servlet
                const datos = new URLSearchParams();
                datos.append('nombre', nombre);
                datos.append('email', correo);
                datos.append('usuario', usuario);
                datos.append('password', pass);

                try {
                    // 4. Enviar la petición asíncrona hacia el RegistroServlet
                    const respuesta = await fetch('/bonuapp/api/registro', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
                        },
                        body: datos
                    });

                    const resultado = await respuesta.json();

                    // 5. Procesar la respuesta del servidor
                    if (respuesta.ok) {
                        mensajeError.style.color = "green";
                        mensajeError.textContent = "✅ " + resultado.mensaje;
                        formulario.reset(); // Limpiar el formulario tras el registro exitoso
                    } else {
                        mensajeError.style.color = "red";
                        mensajeError.textContent = "❌ " + resultado.mensaje;
                    }
                } catch (error) {
                    console.error("Error al conectar con la API:", error);
                    mensajeError.style.color = "red";
                    mensajeError.textContent = "⚠️ Error de conexión con el servidor backend.";
                }
            });
        </script>

</div>
</body>
</html>
